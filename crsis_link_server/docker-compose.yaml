services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: crsis_link
      POSTGRES_PASSWORD: "ju0tj7OXU_gqZt-ouPFOogADSNIcGxID"
    volumes:
      - crsis_link_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "vj7tIQTdKJHtzPh949aHThTocFSdtEqK"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: crsis_link_test
      POSTGRES_PASSWORD: "iamROx6PhtCYPaTh6d-60_il2HXQPwqw"
    volumes:
      - crsis_link_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "BdQbKKNSpYM9reTjpUqu-qmaQ8s5mhxP"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  crsis_link_data:
  crsis_link_test_data:
