# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: ${PUBLIC_HOST}
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server.
insightsServer:
  port: 8081
  publicHost: ${PUBLIC_HOST}
  publicPort: 443
  publicScheme: https

# Configuration for the web server.
webServer:
  port: 8082
  publicHost: ${PUBLIC_HOST}
  publicPort: 443
  publicScheme: https

# PostgreSQL database configuration
database:
  host: 'localhost'
  port: 5432
  name: 'db'
  user: 'postgres'
  requireSsl: true

# Redis configuration (for streaming/scaling)
redis:
  enabled: false
  host: 'localhost'
  port: 6379

maxRequestSize: 524288

sessionLogs:
  consoleEnabled: true
