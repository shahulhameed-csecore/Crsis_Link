class: SosAlert
table: sos_alert
fields:
  deviceId: String
  latitude: double
  longitude: double
  timestamp: DateTime
  message: String?
  isActive: bool
  status: String
  senderName: String
  volunteerDeviceId: String?
  audioUrl: String?
  verificationPin: String?
  isRescuerVerified: bool, default=false
  isVisuallyVerified: bool, default=false
  victimPhone: String
  photoBase64: String?
  approximateLocationText: String?
  clientAlertId: String?
