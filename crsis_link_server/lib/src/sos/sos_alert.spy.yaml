class: SosAlert
table: sos_alert
fields:
  deviceId: String
  latitude: double
  longitude: double
  timestamp: DateTime
  message: String?
  isActive: bool
  status: String
  senderName: String
  volunteerDeviceId: String?
  audioUrl: String?
  verificationPin: String?
  isRescuerVerified: bool, default=false
  isVisuallyVerified: bool, default=false
  photoUrl: String?
  approximateLocationText: String?
  clientAlertId: String
  pinAttempts: int?
  pinLockedUntil: DateTime?
indexes:
  sos_client_alert_id_idx:
    fields: clientAlertId
    unique: true
  sos_active_status_idx:
    fields: isActive, status
  sos_device_idx:
    fields: deviceId
  sos_geo_idx:
    fields: latitude, longitude
